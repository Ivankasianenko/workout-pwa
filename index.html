<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Workout Tracker</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css?v=10" />

  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Тренировки" />
</head>

<body>
  <div class="app">

    <section id="todayScreen" class="screen active">
      <div class="today-date" id="todayDate"></div>

      <div class="hero">
        <img src="trainer.png" class="trainer" alt="trainer" />
      </div>

      <div class="start-block">
        <h1>Выбери тренировку</h1>

        <div class="choice-row">
          <button id="chooseUpper" class="choice active">Верх</button>
          <button id="chooseLower" class="choice">Низ</button>
        </div>

        <button id="startWorkoutBtn" class="start-btn">Начать тренировку</button>
      </div>
    </section>

    <section id="workoutScreen" class="screen">
      <div class="top-row">
        <button id="cancelWorkoutBtn" class="text-btn">Отмена</button>
        <div id="workoutCounter"></div>
      </div>

      <div id="workoutExercise" class="workout-card"></div>
    </section>

    <section id="planScreen" class="screen">
      <h1 class="page-title">План</h1>

      <div class="segmented">
        <button class="plan-tab active" data-type="upper">Верх</button>
        <button class="plan-tab" data-type="lower">Низ</button>
      </div>

      <div id="planList" class="plan-list"></div>
    </section>

    <section id="historyScreen" class="screen">
      <h1 class="page-title">История</h1>
      <div id="historyList" class="history-list"></div>
    </section>

    <section id="calendarScreen" class="screen">
      <div class="calendar-top">
        <h1 class="page-title">Календарь</h1>
        <button id="openScheduleBtn" class="text-btn">Расписание</button>
      </div>

      <div class="month-row">
        <button id="prevMonthBtn" class="arrow-btn">‹</button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonthBtn" class="arrow-btn">›</button>
      </div>

      <div class="weekdays">
        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
      </div>

      <div id="calendarGrid" class="calendar-grid"></div>
    </section>

    <section id="dayDetailScreen" class="screen">
      <button id="backToCalendarBtn" class="text-btn">← Назад</button>
      <h1 id="dayDetailTitle" class="page-title"></h1>
      <div id="dayDetailContent"></div>
    </section>

    <section id="scheduleScreen" class="screen">
      <div class="calendar-top">
        <h1 class="page-title">Расписание</h1>
        <button id="closeScheduleBtn" class="text-btn">Готово</button>
      </div>

      <div id="scheduleList" class="schedule-list"></div>
      <button id="addScheduleBtn" class="add-btn">＋ Добавить день</button>
    </section>

    <nav class="tabbar">
      <button class="nav-btn active" data-screen="todayScreen">
        <span>🔥</span>
        <small>Сегодня</small>
      </button>
      <button class="nav-btn" data-screen="planScreen">
        <span>☷</span>
        <small>План</small>
      </button>
      <button class="nav-btn" data-screen="historyScreen">
        <span>◷</span>
        <small>История</small>
      </button>
      <button class="nav-btn" data-screen="calendarScreen">
        <span>▦</span>
        <small>Календарь</small>
      </button>
    </nav>

  </div>

  <script src="app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>
</body>
</html>
